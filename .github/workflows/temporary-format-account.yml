name: Format touched Rust files

on:
  push:
    branches:
      - horizon-repo-review-plan-abfc6

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: horizon-repo-review-plan-abfc6
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format the two Rust files flagged by CI
        run: |
          rustfmt --edition 2024 launcher/src/account.rs launcher/src/account/tests.rs
          git diff --check
          if ! git diff --quiet -- launcher/src/account.rs launcher/src/account/tests.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add launcher/src/account.rs launcher/src/account/tests.rs
            git commit -m "style: format account ownership changes"
            git push origin HEAD:horizon-repo-review-plan-abfc6
          fi
