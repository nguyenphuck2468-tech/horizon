name: windows-exe
# Builds horizon-launcher.exe for Windows x64. The game's releases stay on upstream's
# launcher.yml (horizon-rust/horizon); this workflow only serves this repository's launcher
# builds and, for a `launcher@X.Y.Z` tag, the release its launcher self-updates from.
#
#   gh workflow run windows-exe                          # build, keep the exe as a run artifact
#   git tag launcher@0.2.1 && git push origin launcher@0.2.1
#                                                        # build and publish a release the
#                                                        # launcher's updater recognizes:
#                                                        # tag launcher@X.Y.Z, the platform's
#                                                        # zip, and signed SHA256SUMS(.sig)
#
# Optional repository variables, compiled into the exe (docs/elyby-account.md, docs/microsoft-account.md):
#   HORIZON_ELY_CLIENT_ID   Ely.by public client ID (Device Code sign-in)
#   HORIZON_MSA_CLIENT_ID   Azure app ID for Microsoft sign-in
# Never put a client secret here.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run cargo test before building
        type: boolean
        default: false
  push:
    branches: [main, horizon-repo-review-plan-abfc6]
    tags: ['launcher@*']
  pull_request:
    paths:
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  # A build or a test run never reaches the telemetry server (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The C runtime linked in: without it the launcher asks for VCRUNTIME140.dll.
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_ELY_CLIENT_ID: ${{ vars.HORIZON_ELY_CLIENT_ID }}
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release variables from the tag
        # A launcher@X.Y.Z tag builds its own release: the version and tag are compiled in
        # (backend.rs VERSION and own_tag), no version-bump commits.
        if: startsWith(github.ref, 'refs/tags/launcher@')
        run: |
          echo "HORIZON_LAUNCHER_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_VERSION=${GITHUB_REF_NAME#launcher@}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: windows-exe
      - name: Test
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Version
        run: target/release/horizon-launcher.exe --version
      - name: Only system libraries
        run: python ../tools/check_imports.py target/release/horizon-launcher.exe
      - name: Collect
        run: |
          mkdir -p out
          cp target/release/horizon-launcher.exe out/horizon-launcher.exe
          # The same binary under the setup's name opens the per-user installer (launcher/src/installer.rs).
          cp target/release/horizon-launcher.exe out/horizon-launcher-setup.exe
          (cd out && sha256sum horizon-launcher.exe horizon-launcher-setup.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-launcher-windows-x64
          path: launcher/out/*
          if-no-files-found: error
          retention-days: 30

  release:
    # Only a pushed launcher@* tag publishes anything: the only tag spelling the launcher's
    # updater recognizes (backend::launcher_version).
    if: startsWith(github.ref, 'refs/tags/launcher@')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: horizon-launcher-windows-x64
          path: out
      - name: Zip the launcher the updater expects (backend::PLATFORMS)
        run: (cd out && zip horizon-launcher-windows-x64.zip horizon-launcher.exe && unzip -t horizon-launcher-windows-x64.zip)
      - name: Sign the checksums (SHA256SUMS, SHA256SUMS.sig)
        env:
          TAG: ${{ github.ref_name }}
          # base64 PKCS#8 Ed25519, the only role of the key: no code runs with it
          # but tools/ci/sign_release.sh (docs/release-flow.md).
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash tools/ci/sign_release.sh "$TAG" out/horizon-launcher-windows-x64.zip
      - uses: dtolnay/rust-toolchain@stable
      - name: The signature, checked as launchers check it
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag "$TAG" out
      # Never marked latest: upstream's own releases stay the repository's latest.
      - name: Publish ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Horizon Launcher $TAG" \
            --notes "This fork's Windows x64 launcher ($TAG). Its SHA256SUMS is signed; the launcher verifies it against the key built into it before it replaces itself." \
            --latest=false \
            out/horizon-launcher-windows-x64.zip out/SHA256SUMS out/SHA256SUMS.sig
